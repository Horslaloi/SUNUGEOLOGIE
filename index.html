<style>
  :root{
    --sand:#EFE7D8; --sand-deep:#E4D9C3; --basalt:#24262B; --basalt-soft:#3B3E46;
    --laterite:#B5502E; --laterite-deep:#8C3A20; --malachite:#2F6E5B; --malachite-soft:#DCEAE4;
    --mica:#C9A227; --schist:#6B6F76; --paper:#FBF8F2; --line:#D9CDB4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 15% 10%, rgba(181,80,46,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(47,110,91,0.12), transparent 50%), var(--sand);
    min-height:100vh; font-family:'Inter', sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px; color:var(--basalt);
  }
  .phone{
    width:375px; max-width:94vw; min-height:640px; background:var(--paper);
    border-radius:28px; border:10px solid var(--basalt);
    box-shadow: 0 30px 60px -20px rgba(36,38,43,0.45);
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  .screen{ flex:1; overflow-y:auto; padding:20px 18px 18px; display:none; }
  .screen.active{display:block;}
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--laterite-deep); margin-bottom:6px; }
  h1.title{ font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:0 0 8px; }
  .sub{ font-size:13.5px; color:var(--schist); margin:0; line-height:1.5; }
  .tabs{ display:flex; gap:8px; margin:20px 0; }
  .tab-btn{ flex:1; padding:12px 8px; border-radius:12px; border:1.4px solid var(--line); background:transparent; color:var(--basalt); font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer; }
  .tab-btn.active{ background:var(--basalt); color:#fff; border-color:var(--basalt); }
  label.field-label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--schist); margin:14px 0 6px; }
  input.field{ width:100%; padding:12px 14px; border-radius:12px; border:1.4px solid var(--line); font-size:14px; font-family:'Inter',sans-serif; background:#fff; }
  textarea.field{ width:100%; padding:12px 14px; border-radius:12px; border:1.4px solid var(--line); font-size:13.5px; font-family:'Inter',sans-serif; background:#fff; resize:vertical; min-height:70px; }
  select.field{ width:100%; padding:12px 14px; border-radius:12px; border:1.4px solid var(--line); font-size:14px; font-family:'Inter',sans-serif; background:#fff; }
  .card-row{ display:flex; justify-content:space-between; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; }
  .card-row .meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--schist); margin-top:2px; }
  .icon-btn{ border:none; background:transparent; cursor:pointer; font-size:16px; color:var(--laterite); padding:4px 8px; }
  .file-pill{ display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; background:var(--malachite-soft); color:var(--malachite); padding:4px 10px; border-radius:20px; margin-top:4px; }
  .progress-wrap{ height:6px; background:var(--sand-deep); border-radius:4px; overflow:hidden; margin-top:10px; }
  .progress-fill{ height:100%; background:var(--malachite); border-radius:4px; transition:width 0.2s; }
  .btn{ font-family:'Inter', sans-serif; font-weight:600; font-size:13.5px; border:none; border-radius:12px; padding:13px 16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
  .btn-primary{background:var(--basalt); color:#fff;}
  .btn-primary:disabled{opacity:0.5; cursor:default;}
  .error-msg{ color:var(--laterite); font-size:12.5px; margin-top:8px; min-height:16px; }
  .link-btn{ background:none; border:none; color:var(--malachite); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0; margin-top:14px; display:block; width:100%; text-align:center; font-family:'Inter',sans-serif; }

  .app-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .greet{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--schist); }
  h2.h2{ font-family:'Fraunces', serif; font-size:21px; font-weight:600; margin:2px 0 0; }
  .avatar{ width:34px; height:34px; border-radius:50%; background:var(--malachite); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces', serif; font-weight:600; font-size:13px; }

  .strata-card{ background:var(--basalt); border-radius:18px; padding:16px; margin-bottom:18px; color:#fff; }
  .strata-label-row{ display:flex; justify-content:space-between; margin-bottom:10px; }
  .strata-stack{ display:flex; flex-direction:column-reverse; gap:3px; height:46px; }
  .strata-band{ border-radius:3px; flex:1; }

  .section-title{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--schist); margin:18px 0 10px; }
  .chapter-row{ display:flex; gap:12px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; cursor:pointer; }
  .swatch{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .chapter-title{ font-family:'Fraunces', serif; font-weight:600; font-size:14.5px; margin:0 0 3px; }
  .chapter-desc{ font-size:11.5px; color:var(--schist); margin:0; }
  .chapter-pct{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--schist); }

  .back-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--schist); cursor:pointer; }
  .lesson-hero{ height:140px; border-radius:16px; margin-bottom:14px; display:flex; align-items:flex-end; padding:14px; }
  .lesson-hero span{ color:#fff; font-family:'Fraunces', serif; font-weight:600; font-size:17px; }
  .quiz-mini{ background:var(--malachite-soft); border-radius:14px; padding:14px; margin-top:4px; cursor:pointer; }

  .qnum{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--schist); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
  .question-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px 16px; }
  .qtext{ font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; line-height:1.35; margin:0 0 16px; }
  .option{ border:1.4px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:9px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .option .letter{ width:22px; height:22px; border-radius:50%; border:1.4px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:11px; flex-shrink:0; }
  .option.correct{background:var(--malachite-soft); border-color:var(--malachite);}
  .option.correct .letter{background:var(--malachite); border-color:var(--malachite); color:#fff;}
  .option.wrong{background:#F6E4DD; border-color:var(--laterite);}
  .option.wrong .letter{background:var(--laterite); border-color:var(--laterite); color:#fff;}
  .feedback{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--malachite); margin:12px 0 4px; line-height:1.5; }

  .result-card{ text-align:center; padding:30px 10px; }
  .result-score{ font-family:'Fraunces', serif; font-size:42px; font-weight:700; color:var(--malachite); }
  .result-sub{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--schist); margin:6px 0 22px; text-transform:uppercase; letter-spacing:0.06em; }

  .stat-row{ display:flex; gap:10px; margin-bottom:18px; }
  .stat-box{ flex:1; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 12px; text-align:center; }
  .stat-num{ font-family:'Fraunces', serif; font-size:24px; font-weight:700; color:var(--malachite); }
  .stat-label{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--schist); margin-top:2px; text-transform:uppercase; letter-spacing:0.05em; }

  .class-row{ display:flex; justify-content:space-between; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px; cursor:pointer; }
  .class-name{font-size:13px; font-weight:600;}
  .class-sub{font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--schist); margin-top:2px;}
  .bar-bg{ width:80px; height:6px; background:var(--sand-deep); border-radius:4px; overflow:hidden; margin:0 10px; }
  .bar-fill{height:100%; background:var(--malachite); border-radius:4px;}

  .footer-bar{ display:flex; justify-content:space-between; padding:10px 18px; border-top:1px solid var(--line); font-size:11px; font-family:'IBM Plex Mono', monospace; color:var(--schist); }
  .footer-bar a{ color:var(--laterite); cursor:pointer; text-decoration:none; }
  .loading{ text-align:center; padding:40px 10px; font-size:12.5px; color:var(--schist); font-family:'IBM Plex Mono', monospace; }
</style>
</head>

/* ============ DONNÉES DE CONTENU ============ */
const CHAPTERS = {

  mag: { title: "Roches magmatiques", color: "#C9A227", desc: "Refroidissement du magma" },

const QUIZ_BANK = {
  sed: [
    { q:"Comment appelle-t-on les couches successives d'une roche sédimentaire ?", options:["Des filons","Des strates","Des failles","Des cristaux"], correct:1, exp:"Les strates résultent de dépôts successifs accumulés au fil du temps." },
    { q:"Quel processus transforme un sédiment meuble en roche dure ?", options:["La diagenèse","La fusion","La subduction","L'érosion"], correct:0, exp:"La diagenèse compacte et cimente les sédiments en roche." },
    { q:"Le calcaire se forme principalement à partir de :", options:["Lave refroidie","Débris organiques marins","Cristaux de quartz","Cendres volcaniques"], correct:1, exp:"Le calcaire provient souvent de coquilles et squelettes marins accumulés." },
    { q:"Le grès est une roche sédimentaire composée principalement de :", options:["Grains de quartz cimentés","Cristaux de mica","Boue calcaire","Cendres volcaniques"], correct:0, exp:"Le grès résulte de la cimentation de grains de sable, surtout du quartz." },
    { q:"Qu'est-ce qu'un fossile ?", options:["Un minéral rare","Une trace ou reste d'organisme conservé dans la roche","Un type de cristal","Une roche magmatique"], correct:1, exp:"Un fossile est la trace ou le reste d'un être vivant préservé dans une roche sédimentaire." },
    { q:"L'argile est une roche sédimentaire caractérisée par :", options:["Des grains très fins", "Des cristaux visibles à l'œil nu","Une origine volcanique","Une grande dureté"], correct:0, exp:"L'argile est formée de particules très fines, invisibles à l'œil nu." },
    { q:"Le principe de superposition indique que :", options:["Les couches les plus jeunes sont en bas","Les couches les plus anciennes sont en bas (sauf déformation)","Toutes les couches ont le même âge","L'ordre des couches est aléatoire"], correct:1, exp:"Sauf déformation tectonique, les couches sédimentaires les plus anciennes se trouvent en dessous des plus récentes." },
    { q:"Le charbon est une roche sédimentaire d'origine :", options:["Minérale","Végétale (organique)","Volcanique","Métamorphique"], correct:1, exp:"Le charbon provient de l'accumulation et de la transformation de matière végétale." },
    { q:"Qu'appelle-t-on un sédiment détritique ?", options:["Un sédiment issu de la précipitation chimique","Un sédiment issu de débris de roches préexistantes","Un sédiment d'origine organique uniquement","Un sédiment volcanique"], correct:1, exp:"Un sédiment détritique provient de la désagrégation de roches préexistantes." },
    { q:"L'évaporite se forme par :", options:["Refroidissement du magma","Évaporation de l'eau et précipitation de sels", "Compression de végétaux","Fusion de roches"], correct:1, exp:"Les évaporites (comme le sel gemme) résultent de l'évaporation d'eau chargée en sels." },
    { q:"Quel est le rôle du ciment dans une roche sédimentaire détritique ?", options:["Colorer la roche","Lier les grains entre eux","Augmenter la porosité","Créer des fossiles"], correct:1, exp:"Le ciment (souvent calcaire ou siliceux) lie les grains entre eux lors de la diagenèse." },
    { q:"La stratification entrecroisée indique généralement :", options:["Un dépôt en eau calme et profonde","Un dépôt par un courant (vent, rivière)","Une origine volcanique","Un métamorphisme intense"], correct:1, exp:"Les stratifications entrecroisées se forment sous l'action de courants (dunes, rivières)." },
    { q:"Le poudingue (conglomérat) est caractérisé par :", options:["Des grains très fins uniquement","Des galets arrondis cimentés entre eux","Une structure cristalline","Une origine chimique pure"], correct:1, exp:"Le poudingue est un conglomérat formé de galets arrondis pris dans un ciment." },
    { q:"Quel milieu de dépôt est typique du calcaire récifal ?", options:["Désert aride","Milieu marin peu profond et chaud","Glacier","Volcan actif"], correct:1, exp:"Les récifs calcaires se forment en milieu marin peu profond, chaud et riche en organismes." },
    { q:"La diagenèse regroupe :", options:["Uniquement la compaction","Compaction et cimentation des sédiments","La fusion des roches","Le métamorphisme de contact"], correct:1, exp:"La diagenèse inclut la compaction et la cimentation qui transforment un sédiment en roche." },
    { q:"Un sédiment transporté par le vent est dit :", options:["Alluvial","Éolien","Glaciaire","Marin"], correct:1, exp:"Un dépôt éolien est transporté et déposé par le vent (ex. dunes de sable)." },
    { q:"La craie est une roche sédimentaire riche en :", options:["Quartz","Micro-organismes calcaires (foraminifères, coccolithes)","Argile pure","Minéraux métalliques"], correct:1, exp:"La craie est formée de restes de micro-organismes marins à coquille calcaire." },
    { q:"Quel indice permet de reconnaître un ancien environnement marin dans une roche sédimentaire ?", options:["Présence de fossiles marins","Couleur rouge uniquement","Grande dureté","Absence totale de grains"], correct:0, exp:"La présence de fossiles marins (coquillages, coraux) atteste d'un ancien milieu marin." },
    { q:"La bauxite, minerai d'aluminium, se forme par :", options:["Altération de roches en climat tropical humide","Refroidissement du magma","Compression de végétaux","Précipitation en milieu glaciaire"], correct:0, exp:"La bauxite résulte de l'altération intense de roches sous climat tropical humide." },
    { q:"Le principe de continuité latérale stipule que :", options:["Une couche sédimentaire s'étend horizontalement jusqu'à disparaître ou changer de nature","Chaque couche a une épaisseur constante partout dans le monde","Les couches sont toujours verticales","Les couches se forment instantanément"], correct:0, exp:"Une couche sédimentaire garde sa continuité latéralement, sauf interruption ou changement de faciès." }
  ],
  mag: [
    { q:"Quelle roche se forme par refroidissement rapide du magma en surface ?", options:["Le granite","Le basalte","Le calcaire","Le grès"], correct:1, exp:"Le basalte refroidit vite en surface, ce qui donne des cristaux très fins." },
    { q:"Le granite est une roche…", options:["Volcanique","Plutonique","Sédimentaire","Métamorphique"], correct:1, exp:"Le granite se forme en profondeur par refroidissement lent." },
    { q:"Le magma qui atteint la surface est appelé :", options:["Lave","Basalte","Obsidienne","Cendre"], correct:0, exp:"On parle de lave une fois que le magma sort en surface." },
    { q:"Une roche magmatique à gros cristaux visibles est dite :", options:["Aphanitique","Vitreuse","Grenue (phanéritique)","Amorphe"], correct:2, exp:"Une texture grenue (gros cristaux visibles) résulte d'un refroidissement lent en profondeur." },
    { q:"L'obsidienne est une roche volcanique caractérisée par :", options:["Une structure vitreuse sans cristaux","De gros cristaux de quartz","Une origine sédimentaire","Une forte teneur en fossiles"], correct:0, exp:"L'obsidienne résulte d'un refroidissement si rapide qu'aucun cristal ne peut se former : elle est vitreuse." },
    { q:"Le gabbro est l'équivalent plutonique de :", options:["Du granite","Du basalte","De la rhyolite","De l'andésite"], correct:1, exp:"Le gabbro et le basalte ont la même composition chimique, mais des textures différentes selon la vitesse de refroidissement." },
    { q:"Qu'est-ce qu'un minéral felsique ?", options:["Un minéral riche en fer et magnésium","Un minéral clair, riche en silice (quartz, feldspath)","Un minéral uniquement métamorphique","Un minéral sédimentaire"], correct:1, exp:"Les minéraux felsiques sont clairs et riches en silice, comme le quartz et le feldspath." },
    { q:"Une roche magmatique intrusive se forme :", options:["En surface, au contact de l'air","En profondeur, dans la croûte terrestre","Dans l'océan uniquement","Par précipitation chimique"], correct:1, exp:"Une roche intrusive (ou plutonique) cristallise lentement en profondeur." },
    { q:"La rhyolite est l'équivalent volcanique de :", options:["Du basalte","Du granite","Du gabbro","Du marbre"], correct:1, exp:"La rhyolite a la même composition que le granite mais une texture fine due à un refroidissement rapide." },
    { q:"Le point de fusion des roches dans le manteau dépend principalement de :", options:["La couleur de la roche","La température et la pression","La présence de fossiles","La taille des continents"], correct:1, exp:"La fusion des roches dépend de l'interaction entre température, pression et composition." },
    { q:"Qu'est-ce que le magma ?", options:["De la roche fondue en profondeur","De la lave refroidie","Un type de sédiment","Un minéral métamorphique"], correct:0, exp:"Le magma est de la roche en fusion présente sous la surface terrestre." },
    { q:"Une éruption volcanique effusive produit surtout :", options:["Des coulées de lave fluide","Des explosions violentes de cendres","Des séismes uniquement","Des roches sédimentaires"], correct:0, exp:"Une éruption effusive libère une lave fluide qui s'écoule plutôt que d'exploser." },
    { q:"La pierre ponce est caractérisée par :", options:["Sa densité très élevée","Sa structure poreuse remplie de bulles de gaz","Sa composition sédimentaire","Sa transparence totale"], correct:1, exp:"La pierre ponce contient de nombreuses bulles de gaz emprisonnées lors du refroidissement rapide." },
    { q:"Le terme 'mafique' désigne des roches riches en :", options:["Silice et aluminium","Fer et magnésium","Carbone organique","Calcium uniquement"], correct:1, exp:"Les roches mafiques (ex. basalte) sont riches en fer et magnésium, et généralement sombres." },
    { q:"Un dyke est :", options:["Une coulée de lave en surface","Une intrusion magmatique qui recoupe les couches encaissantes","Un type de fossile","Une roche sédimentaire"], correct:1, exp:"Un dyke est une injection de magma qui recoupe transversalement les roches environnantes." },
    { q:"La viscosité d'un magma dépend fortement de :", options:["Sa couleur","Sa teneur en silice","La saison","La taille des fossiles qu'il contient"], correct:1, exp:"Plus un magma est riche en silice, plus il est visqueux." },
    { q:"Une andésite est une roche volcanique de composition :", options:["Ultramafique","Intermédiaire","Purement sédimentaire","Carbonatée"], correct:1, exp:"L'andésite a une composition intermédiaire entre le basalte et la rhyolite." },
    { q:"Le processus de cristallisation fractionnée permet :", options:["De transformer un sédiment en roche","De séparer différents minéraux selon leur température de cristallisation","De fondre une roche métamorphique","De créer des fossiles"], correct:1, exp:"La cristallisation fractionnée sépare les minéraux au fur et à mesure du refroidissement du magma." },
    { q:"Le péridotite est une roche typique :", options:["De la croûte continentale","Du manteau terrestre","Des sédiments marins","Des roches métamorphiques de contact"], correct:1, exp:"La péridotite est la roche principale constituant le manteau terrestre." },
    { q:"Une roche magmatique se distingue d'une roche métamorphique car elle provient :", options:["De la solidification d'un magma","De la transformation à l'état solide d'une roche préexistante","De l'accumulation de sédiments","De l'érosion de montagnes"], correct:0, exp:"Une roche magmatique résulte directement de la cristallisation d'un magma, contrairement à la roche métamorphique." }
  ],
  met: [

async function submitAuth() {
  const email = document.getElementById('in-email').value.trim();
  const pass = document.getElementById('in-pass').value;
  const btn = document.getElementById('submit-auth');
  btn.disabled = true;
  btn.textContent = "Patiente…";

  try {
    if (authMode === "register") {
      let rawEstab = "", rawClass = "";
      if (authRole === "eleve") {
        rawEstab = document.getElementById('in-eleve-estab-input').value.trim();
        rawClass = document.getElementById('in-eleve-class-input').value.trim();
      } else if (authRole === "enseignant") {
        rawEstab = document.getElementById('in-etab').value.trim();
      }
      const company = authRole === "entreprise" ? document.getElementById('in-company').value.trim() : "";
      const sector = authRole === "entreprise" ? document.getElementById('in-sector').value.trim() : "";
      const name = authRole === "entreprise" ? "" : document.getElementById('in-name').value.trim();

      let teacherFields = {};
      if (authRole === "enseignant") {
        const levels = Array.from(document.querySelectorAll('.teacher-level-cb:checked')).map(cb => cb.value);
        teacherFields = {
          profession: document.getElementById('in-teacher-profession').value,
          subjects: document.getElementById('in-teacher-subjects').value.trim(),
          levels,
          function: document.getElementById('in-teacher-function').value,
          experience: document.getElementById('in-teacher-experience').value.trim(),
          diplomas: document.getElementById('in-teacher-diplomas').value.trim(),
          specialties: document.getElementById('in-teacher-specialties').value.trim()
        };
      }

      let companyFields = {};
      let repFirstName = "", repLastName = "", repFunction = "";
      if (authRole === "entreprise") {
        repFirstName = document.getElementById('in-rep-firstname').value.trim();
        repLastName = document.getElementById('in-rep-lastname').value.trim();
        repFunction = document.getElementById('in-rep-function').value.trim();
        const objectives = Array.from(document.querySelectorAll('.company-objective-cb:checked')).map(cb => cb.value);
        companyFields = {
          description: document.getElementById('in-company-desc').value.trim(),
          website: document.getElementById('in-company-website').value.trim(),
          country: document.getElementById('in-company-country').value.trim(),
          city: document.getElementById('in-company-city').value.trim(),
          address: document.getElementById('in-company-address').value.trim(),
          foundedYear: document.getElementById('in-company-year').value.trim(),
          size: document.getElementById('in-company-size').value,
          regNumber: document.getElementById('in-company-regnum').value.trim(),
          repFirstName, repLastName, repFunction,
          repPhone: document.getElementById('in-rep-phone').value.trim(),
          objectives, verified: false
        };
      }

      if (authRole !== "entreprise" && !name) throw new Error("Merci d'indiquer ton nom.");
      if (authRole === "eleve" && !rawEstab) throw new Error("Merci d'indiquer ton établissement.");
      if (authRole === "eleve" && !rawClass) throw new Error("Merci d'indiquer ta classe.");
      if (authRole === "enseignant" && !rawEstab) throw new Error("Merci d'indiquer ton établissement.");
      if (authRole === "entreprise") {
        if (!company) throw new Error("Merci d'indiquer le nom de l'entreprise.");
        if (!sector) throw new Error("Merci d'indiquer le secteur d'activité.");
        if (!repFirstName || !repLastName) throw new Error("Merci d'indiquer le prénom et le nom du représentant.");
        if (!repFunction) throw new Error("Merci d'indiquer la fonction du représentant.");
      }

      const finalName = authRole === "entreprise" ? `${repFirstName} ${repLastName}`.trim() : name;

      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      const uid = cred.user.uid;

      try {
        // Résolution établissement/classe : correspondance existante ou création "à vérifier"
        let etab = "", establishmentId = null, establishmentName = null, classId = null, className = null;
        if (authRole === "eleve") {
          const estab = await resolveEstablishment(rawEstab, uid, "eleve", finalName);
          establishmentId = estab.id; establishmentName = estab.name; etab = estab.name;
          const cls = await resolveClass(estab.id, rawClass, uid, "eleve", finalName);
          classId = cls.id; className = cls.name;
        } else if (authRole === "enseignant") {
          const estab = await resolveEstablishment(rawEstab, uid, "enseignant", finalName);
          establishmentId = estab.id; establishmentName = estab.name; etab = estab.name;
        }

        // Note sécurité : "role" est limité côté serveur (règles Firestore) à eleve/enseignant/entreprise.
        // Un compte "admin" ne peut jamais être créé depuis ce formulaire public.
        const profile = {
          uid, name: finalName, email, role: authRole,
          etab: etab || null, company: company || null, sector: sector || null,
          establishmentId: establishmentId || null, establishmentName: establishmentName || null,
          classId: classId || null, className: className || null,
          ...teacherFields, ...companyFields,
          scores: {}, joined: new Date().toISOString(), lastActive: new Date().toISOString()
        };
        await db.collection("users").doc(uid).set(profile);
      } catch (innerErr) {
        // Si une étape échoue après la création du compte de connexion, on supprime ce compte
        // "fantôme" pour que l'e-mail reste réutilisable et qu'aucune donnée orpheline ne subsiste.
        await cred.user.delete().catch(() => {});
        throw innerErr;
      }
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
    // onAuthStateChanged prendra le relais
  } catch (e) {
    btn.disabled = false;
    btn.textContent = authMode === "login" ? "Se connecter →" : "Créer mon compte →";
    renderAuthScreen(translateFirebaseError(e));
  }
}

function translateFirebaseError(e) {
  const msg = e.message || "";
  if (msg.includes("email-already-in-use")) return "Cet e-mail est déjà utilisé.";
  if (msg.includes("wrong-password") || msg.includes("invalid-credential")) return "E-mail ou mot de passe incorrect.";
  if (msg.includes("user-not-found")) return "Aucun compte avec cet e-mail.";
  if (msg.includes("weak-password")) return "Mot de passe trop court (6 caractères min).";
  if (msg.includes("invalid-email")) return "Adresse e-mail invalide.";
  return e.message || "Une erreur est survenue.";
}

/* ============ ÉCRAN QUIZ ============ */
function renderQuiz() {
  const questions = QUIZ_BANK[activeChapter];
  const item = questions[quizState.idx];
  const letters = ["A", "B", "C", "D"];

  render(`
    <div class="screen active">
      <div class="back-row" id="quit-quiz">← Quitter</div>
      <div class="qnum">Question ${quizState.idx + 1} / ${questions.length}</div>
      <div class="question-card">
        <h3 class="qtext">${item.q}</h3>
        <div id="options-wrap">
          ${item.options.map((opt, i) => `<div class="option" data-i="${i}"><span class="letter">${letters[i]}</span> ${opt}</div>`).join('')}
        </div>
        <div id="feedback-wrap"></div>
      </div>
    </div>
    ${footerHtml()}
  `);
  document.getElementById('quit-quiz').onclick = renderLesson;
  document.querySelectorAll('#options-wrap .option').forEach(el => {
    el.onclick = () => answerQuiz(parseInt(el.dataset.i));
  });
  attachFooter();
}

function answerQuiz(i) {
  if (quizState.answered !== null) return;
  const questions = QUIZ_BANK[activeChapter];
  const item = questions[quizState.idx];
  quizState.answered = i;
  if (i === item.correct) quizState.score += 1;

  document.querySelectorAll('#options-wrap .option').forEach((el, idx) => {
    el.style.pointerEvents = "none";
    if (idx === item.correct) el.classList.add('correct');
    else if (idx === i) el.classList.add('wrong');
  });

  const isLast = quizState.idx + 1 === questions.length;
  document.getElementById('feedback-wrap').innerHTML = `
    <div class="feedback">${i === item.correct ? "✓ Exact — " : "✕ Presque — "}${item.exp}</div>
    <button class="btn btn-primary" id="next-q" style="margin-top:14px;">${isLast ? "Voir le résultat →" : "Question suivante →"}</button>
  `;
  document.getElementById('next-q').onclick = () => {
    if (isLast) finishQuiz();
    else { quizState.idx += 1; quizState.answered = null; renderQuiz(); }
  };
}

async function finishQuiz() {
  const questions = QUIZ_BANK[activeChapter];
  const pct = Math.round((quizState.score / questions.length) * 100);

  currentProfile.scores[activeChapter] = pct;
  currentProfile.lastActive = new Date().toISOString();
  await db.collection("users").doc(currentUser.uid).update({
    [`scores.${activeChapter}`]: pct,
    lastActive: currentProfile.lastActive
  });

  render(`
    <div class="screen active">
      <div class="result-card">
        <div class="result-score">${quizState.score}/${questions.length}</div>
        <div class="result-sub">${pct}% de réussite — sauvegardé</div>
        <button class="btn btn-primary" id="back-lesson">Retour au chapitre</button>
      </div>
    </div>
    ${footerHtml()}
  `);
  document.getElementById('back-lesson').onclick = renderLesson;
  attachFooter();
}

async function loadTeacherData() {
  const assignments = currentProfile.teachingAssignments || [];
  // Ensembles des classes réellement enseignées (pas juste "associées")
  const assignedClassIds = new Set(assignments.map(a => a.classId));
  const relevantEstabIds = teacherEstabFilter === "tous"
    ? new Set(assignments.map(a => a.establishmentId))
    : new Set([teacherEstabFilter]);

  const snap = await db.collection("users").where("role", "==", "eleve").get();
  const allStudents = snap.docs.map(d => d.data());

  // Un élève n'apparaît que s'il est dans une classe que l'enseignant enseigne réellement,
  // et dans un établissement couvert par le filtre actuel.
  const students = allStudents.filter(s =>
    s.classId && assignedClassIds.has(s.classId) && relevantEstabIds.has(s.establishmentId)
  );

  const distinctClassIds = new Set(students.map(s => s.classId));
  const avg = (s) => {
    const vals = Object.values(s.scores || {});
    return vals.length ? Math.round(vals.reduce((a,b) => a+b, 0) / vals.length) : 0;
  };

  document.getElementById('stats-wrap').innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${students.length}</div><div class="stat-label">Élèves suivis</div></div>
      <div class="stat-box"><div class="stat-num">${distinctClassIds.size}</div><div class="stat-label">Classes</div></div>
    </div>
    <div class="section-title">Mes élèves</div>
    ${students.length === 0 ? `<p style="font-size:12.5px; color:var(--schist);">Aucun élève dans ce périmètre pour l'instant.</p>` : ''}
    ${students.map(s => `
      <div class="class-row" data-uid="${s.uid}">
        <div style="flex:1; min-width:0;">
          <div class="class-name">${s.name}</div>
          <div class="class-sub">${s.etab || '—'} · ${s.className || ''}</div>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${avg(s)}%"></div></div>
        <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--schist);">${avg(s)}%</span>
      </div>
    `).join('')}
  `;
  document.querySelectorAll('.class-row').forEach(el => {
    el.onclick = () => renderProfile(el.dataset.uid);
  });
}

/* ============ CACHE ÉTABLISSEMENTS + CLASSES (partagé admin & inscription) ============ */
let establishmentsCache = null;

async function loadEstablishmentsCache(forceReload) {
  if (establishmentsCache !== null && !forceReload) return establishmentsCache;
  const snap = await db.collection("establishments").orderBy("createdAt").get();
  const list = [];
  for (const doc of snap.docs) {
    const classesSnap = await db.collection("establishments").doc(doc.id).collection("classes").orderBy("createdAt").get();
    list.push({
      id: doc.id, ...doc.data(),
      classes: classesSnap.docs.map(c => ({ id: c.id, ...c.data() }))
    });
  }
  establishmentsCache = list;
  return list;
}

/* ============ CORRESPONDANCE FLOUE (détection de doublons établissements/classes) ============ */
function normalizeStr(s) {
  return (s || "").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}
function findFuzzyMatch(inputName, candidates, getName) {
  const norm = normalizeStr(inputName);
  if (!norm) return null;
  let best = null, bestRatio = 1;
  for (const c of candidates) {
    const cn = normalizeStr(getName(c));
    if (cn === norm) return c; // correspondance exacte
    const dist = levenshtein(cn, norm);
    const maxLen = Math.max(cn.length, norm.length) || 1;
    const ratio = dist / maxLen;
    if (ratio < bestRatio) { bestRatio = ratio; best = c; }
  }
  return (best && bestRatio <= 0.15) ? best : null; // seuil ~85% de similarité
}

/* Trouve un établissement existant correspondant, ou en crée un nouveau "à vérifier" */
async function resolveEstablishment(rawName, creatorUid, creatorRole, creatorName) {
  await loadEstablishmentsCache();
  const match = findFuzzyMatch(rawName, establishmentsCache, e => e.name);
  if (match) return { id: match.id, name: match.name };

  const docRef = await db.collection("establishments").add({
    name: rawName.trim(), city: "", type: "Non précisé",
    status: "pending", createdBy: creatorUid, createdByRole: creatorRole, createdByName: creatorName,
    createdAt: new Date().toISOString()
  });
  await loadEstablishmentsCache(true);
  return { id: docRef.id, name: rawName.trim() };
}

/* Trouve une classe existante dans cet établissement, ou en crée une nouvelle "à vérifier" */
async function resolveClass(establishmentId, rawClassName, creatorUid, creatorRole, creatorName) {
  await loadEstablishmentsCache(true);
  const estab = establishmentsCache.find(e => e.id === establishmentId);
  const classes = estab ? estab.classes : [];
  const match = findFuzzyMatch(rawClassName, classes, c => c.name);
  if (match) return { id: match.id, name: match.name };

  const docRef = await db.collection("establishments").doc(establishmentId).collection("classes").add({
    name: rawClassName.trim(), level: "",
    status: "pending", createdBy: creatorUid, createdByRole: creatorRole, createdByName: creatorName,
    createdAt: new Date().toISOString()
  });
  await loadEstablishmentsCache(true);
  return { id: docRef.id, name: rawClassName.trim() };
}

function renderAdminEstablishmentsList() {
  const wrap = document.getElementById('estab-wrap');
  if (!wrap) return;
  if (establishmentsCache.length === 0) { wrap.innerHTML = `<p style="font-size:12.5px; color:var(--schist);">Aucun établissement pour l'instant.</p>`; return; }
  const pendingCount = establishmentsCache.filter(e => e.status === "pending").length;
  wrap.innerHTML = `
    ${pendingCount > 0 ? `<p style="font-size:11.5px; color:var(--laterite); margin-bottom:10px;">⚠ ${pendingCount} établissement(s) à vérifier</p>` : ''}
    ${establishmentsCache.map(e => `
    <div class="card-row" data-id="${e.id}">
      <div>
        <div class="chapter-title" style="margin:0;">${e.name}${e.status === 'pending' ? ' <span style="color:var(--laterite); font-size:11px; font-weight:600;">À vérifier</span>' : ''}</div>
        <div class="meta">${e.type} · ${e.city || ''} · ${e.classes.length} classe(s)${e.createdByName ? ' · ajouté par ' + e.createdByName : ''}</div>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        ${e.status === 'pending' ? `<button class="icon-btn validate-estab" data-id="${e.id}" title="Valider" style="color:var(--malachite);">✓</button>` : ''}
        <button class="icon-btn del-estab" data-id="${e.id}" title="Supprimer">✕</button>
      </div>
    </div>
  `).join('')}
  `;
  wrap.querySelectorAll('.card-row').forEach(el => {
    el.onclick = (ev) => { if (ev.target.classList.contains('del-estab') || ev.target.classList.contains('validate-estab')) return; renderAdminClasses(el.dataset.id); };
  });
  wrap.querySelectorAll('.validate-estab').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      await db.collection("establishments").doc(btn.dataset.id).update({ status: "verified" });
      await loadEstablishmentsCache(true);
      renderAdminEstablishmentsList();
    };
  });
  wrap.querySelectorAll('.del-estab').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("Supprimer cet établissement et toutes ses classes ?")) return;
      await db.collection("establishments").doc(btn.dataset.id).delete();
      await loadEstablishmentsCache(true);
      renderAdminEstablishmentsList();
    };
  });
}

let userFilterRole = "tous";
let userSearchText = "";

async function renderAdminUsers() {
  render(`
    <div class="screen active">
      <div class="back-row" id="back-admin-users">← Administration</div>
      <div class="app-header"><h2 class="h2">Utilisateurs</h2></div>
      <input class="field" id="user-search" placeholder="Rechercher un nom…" style="margin-bottom:10px;" value="${userSearchText}" />
      <div class="tabs" id="role-filter-tabs">
        <button class="tab-btn ${userFilterRole === 'tous' ? 'active' : ''}" data-role="tous">Tous</button>
        <button class="tab-btn ${userFilterRole === 'eleve' ? 'active' : ''}" data-role="eleve">Élèves</button>
        <button class="tab-btn ${userFilterRole === 'enseignant' ? 'active' : ''}" data-role="enseignant">Enseignants</button>
        <button class="tab-btn ${userFilterRole === 'entreprise' ? 'active' : ''}" data-role="entreprise">Entreprises</button>
      </div>
      <div id="admin-users-wrap"><div class="loading">Chargement…</div></div>
    </div>
    ${footerHtml()}
  `);
  document.getElementById('back-admin-users').onclick = renderAdmin;
  document.querySelectorAll('#role-filter-tabs .tab-btn').forEach(b => {
    b.onclick = () => { userFilterRole = b.dataset.role; renderAdminUsers(); };
  });
  document.getElementById('user-search').oninput = (e) => {
    userSearchText = e.target.value;
    loadAdminUsers();
  };
  attachFooter();
  loadAdminUsers();
}

async function loadAdminUsers() {
  const snap = await db.collection("users").get();
  let all = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  if (userFilterRole !== "tous") all = all.filter(u => u.role === userFilterRole);
  if (userSearchText.trim()) {
    const q = userSearchText.trim().toLowerCase();
    all = all.filter(u => (u.name || '').toLowerCase().includes(q) || (u.company || '').toLowerCase().includes(q) || (u.etab || '').toLowerCase().includes(q));
  }

  const wrap = document.getElementById('admin-users-wrap');
  if (all.length === 0) { wrap.innerHTML = `<p style="font-size:12.5px; color:var(--schist);">Aucun utilisateur trouvé.</p>`; return; }

  const roleLabel = { eleve: "Élève", enseignant: "Enseignant", entreprise: "Entreprise", admin: "Admin" };
  wrap.innerHTML = all.map(u => `
    <div class="card-row" data-id="${u.id}">
      <div>
        <div class="chapter-title" style="margin:0;">${u.company || u.name}${u.status === 'disabled' ? ' <span style="color:var(--laterite); font-size:11px;">(désactivé)</span>' : ''}</div>
        <div class="meta">${roleLabel[u.role] || u.role} · ${u.etab || u.sector || ''}</div>
      </div>
      <span style="color:var(--schist);">→</span>
    </div>
  `).join('');
  wrap.querySelectorAll('.card-row').forEach(el => {
    el.onclick = () => renderUserDetail(el.dataset.id);
  });
}

async function renderUserDetail(uid) {
  render(`
    <div class="screen active">
      <div class="back-row" id="back-users">← Utilisateurs</div>
      <div id="user-detail-wrap"><div class="loading">Chargement…</div></div>
    </div>
    ${footerHtml()}
  `);
  document.getElementById('back-users').onclick = renderAdminUsers;
  attachFooter();

  const docSnap = await db.collection("users").doc(uid).get();
  if (!docSnap.exists) { document.getElementById('user-detail-wrap').innerHTML = `<p style="font-size:12.5px; color:var(--schist);">Ce compte n'existe plus.</p>`; return; }
  const u = docSnap.data();
  const roleLabel = { eleve: "Élève", enseignant: "Enseignant", entreprise: "Entreprise", admin: "Admin" };
  const isDisabled = u.status === "disabled";
  const isVerified = u.verified === true;

  const rows = [
    ["Nom", u.name],
    ["E-mail", u.email || '—'],
    ["Rôle", roleLabel[u.role] || u.role],
    u.etab ? ["Établissement", u.etab] : null,
    u.className ? ["Classe", u.className] : null,
    u.company ? ["Entreprise", u.company] : null,
    u.sector ? ["Secteur", u.sector] : null,
    u.description ? ["Description", u.description] : null,
    u.website ? ["Site web", u.website] : null,
    (u.city || u.country) ? ["Localisation", [u.city, u.country].filter(Boolean).join(', ')] : null,
    u.address ? ["Adresse professionnelle", u.address] : null,
    u.foundedYear ? ["Année de création", u.foundedYear] : null,
    u.size ? ["Taille de l'entreprise", u.size + ' employés'] : null,
    u.regNumber ? ["Numéro d'identification", u.regNumber] : null,
    (u.repFirstName || u.repLastName) ? ["Représentant", `${u.repFirstName || ''} ${u.repLastName || ''}`.trim()] : null,
    u.repFunction ? ["Fonction du représentant", u.repFunction] : null,
    u.repPhone ? ["Téléphone professionnel", u.repPhone] : null,
    (u.objectives && u.objectives.length) ? ["Objectifs sur la plateforme", u.objectives.join(', ')] : null,
    u.role === "entreprise" ? ["Vérification", isVerified ? "✓ Entreprise vérifiée" : "Non vérifiée"] : null,
    u.profession ? ["Profession", u.profession] : null,
    u.subjects ? ["Matière(s) enseignée(s)", u.subjects] : null,
    (u.levels && u.levels.length) ? ["Niveau(x) enseigné(s)", u.levels.join(', ')] : null,
    u.function ? ["Fonction", u.function] : null,
    u.experience ? ["Années d'expérience", u.experience] : null,
    u.diplomas ? ["Diplômes et qualifications", u.diplomas] : null,
    u.specialties ? ["Spécialités", u.specialties] : null,
    ["Inscrit le", new Date(u.joined).toLocaleDateString('fr-FR')],
    ["Dernière activité", u.lastActive ? new Date(u.lastActive).toLocaleDateString('fr-FR') : '—'],
    ["Statut", isDisabled ? "Désactivé" : "Actif"]
  ].filter(Boolean);

  document.getElementById('user-detail-wrap').innerHTML = `
    <div class="app-header"><h2 class="h2">${u.company || u.name}</h2></div>
    ${rows.map(([label, val]) => `
      <div class="chapter-row" style="cursor:default;">
        <div style="flex:1;"><div class="meta" style="margin-bottom:2px;">${label}</div><div class="chapter-title" style="margin:0; font-size:13.5px;">${val}</div></div>
      </div>
    `).join('')}
    <div class="section-title">Actions</div>
    ${u.role === "enseignant" ? `<div id="assignments-section"><div class="loading">Chargement des affectations…</div></div>` : ''}
    ${u.role === "entreprise" ? `
      <button class="btn btn-primary" id="toggle-verified" style="margin-bottom:10px; background:${isVerified ? 'var(--schist)' : 'var(--malachite)'};">
        ${isVerified ? 'Retirer la vérification' : '✓ Marquer comme vérifiée'}
      </button>
    ` : ''}
    <button class="btn btn-primary" id="toggle-status" style="margin-bottom:10px; background:${isDisabled ? 'var(--malachite)' : 'var(--basalt)'};">
      ${isDisabled ? 'Réactiver le compte' : 'Désactiver le compte'}
    </button>
    <button class="btn btn-primary" id="delete-user" style="background:var(--laterite);">Supprimer définitivement</button>
    <p style="font-size:11px; color:var(--schist); margin-top:10px; line-height:1.5;">
      La désactivation bloque immédiatement l'accès. La suppression retire le profil et bloque l'accès de façon permanente.
    </p>
  `;
  if (u.role === "enseignant") {
    await renderTeacherAssignments(uid, u);
  }
  if (u.role === "entreprise") {
    document.getElementById('toggle-verified').onclick = async () => {
      await db.collection("users").doc(uid).update({ verified: !isVerified });
      renderUserDetail(uid);
    };
  }
  document.getElementById('toggle-status').onclick = async () => {
    await db.collection("users").doc(uid).update({ status: isDisabled ? "actif" : "disabled" });
    renderUserDetail(uid);
  };
  document.getElementById('delete-user').onclick = async () => {
    if (!confirm(`Supprimer définitivement le compte de ${u.name} ? Cette action est irréversible.`)) return;
    await db.collection("users").doc(uid).delete();
    renderAdminUsers();
  };
}

/* ============ AFFECTATIONS PÉDAGOGIQUES D'UN ENSEIGNANT (établissement + classe réellement enseignés) ============ */
async function renderTeacherAssignments(uid, u) {
  await loadEstablishmentsCache(true);
  const assignments = u.teachingAssignments || [];
  const section = document.getElementById('assignments-section');

  section.innerHTML = `
    <div style="font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--schist); margin-bottom:8px;">Affectations pédagogiques (classes réellement enseignées)</div>
    ${assignments.length === 0 ? `<p style="font-size:12px; color:var(--schist); margin-bottom:10px;">Aucune affectation pour l'instant.</p>` : assignments.map((a, i) => `
      <div class="card-row" style="cursor:default;">
        <div><div class="chapter-title" style="margin:0; font-size:13px;">${a.establishmentName}</div><div class="meta">${a.className}</div></div>
        <button class="icon-btn remove-assignment" data-i="${i}" title="Retirer">✕</button>
      </div>
    `).join('')}
    ${establishmentsCache.length === 0 ? `
      <p style="font-size:12px; color:var(--schist); margin:8px 0;">Crée d'abord un établissement et une classe dans "Gestion des établissements".</p>
    ` : `
      <select class="field" id="assign-estab-select" style="margin-bottom:8px;">
        ${establishmentsCache.map(e => `<option value="${e.id}">${e.name}</option>`).join('')}
      </select>
      <select class="field" id="assign-class-select" style="margin-bottom:8px;"></select>
      <button class="btn btn-primary" id="add-assignment" style="margin-bottom:16px;">+ Ajouter cette affectation</button>
    `}
  `;

  section.querySelectorAll('.remove-assignment').forEach(btn => {
    btn.onclick = async () => {
      const newAssignments = assignments.filter((_, i) => i !== parseInt(btn.dataset.i));
      await db.collection("users").doc(uid).update({ teachingAssignments: newAssignments });
      const updated = { ...u, teachingAssignments: newAssignments };
      renderTeacherAssignments(uid, updated);
    };
  });

  if (establishmentsCache.length > 0) {
    const estabSelect = document.getElementById('assign-estab-select');
    const classSelect = document.getElementById('assign-class-select');
    const populateClasses = () => {
      const estab = establishmentsCache.find(e => e.id === estabSelect.value);
      classSelect.innerHTML = estab.classes.length
        ? estab.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
        : `<option value="">Aucune classe dans cet établissement</option>`;
    };
    estabSelect.onchange = populateClasses;
    populateClasses();

    document.getElementById('add-assignment').onclick = async () => {
      const estab = establishmentsCache.find(e => e.id === estabSelect.value);
      const cls = estab.classes.find(c => c.id === classSelect.value);
      if (!cls) return;
      const newAssignment = { establishmentId: estab.id, establishmentName: estab.name, classId: cls.id, className: cls.name };
      const newAssignments = [...assignments, newAssignment];
      await db.collection("users").doc(uid).update({ teachingAssignments: newAssignments });
      const updated = { ...u, teachingAssignments: newAssignments };
      renderTeacherAssignments(uid, updated);
    };
  }
}

/* Config Cloudinary — upload direct depuis le navigateur, sans clé secrète exposée */
const CLOUDINARY_CLOUD_NAME = "vavphutl";
const CLOUDINARY_UPLOAD_PRESET = "sunugeologie_docs";

async function submitNewCourse(subjectId, themeId, subjectName, themeName) {
  const title = document.getElementById('new-course-title').value.trim();
  const desc = document.getElementById('new-course-desc').value.trim();
  const level = document.getElementById('new-course-level').value.trim();
  const visibility = document.getElementById('new-course-visibility').value;
  const fileInput = document.getElementById('new-course-file');
  const file = fileInput.files[0];
  const errEl = document.getElementById('course-error');
  const btn = document.getElementById('add-course');
  const progressWrap = document.getElementById('upload-progress-wrap');
  const progressFill = document.getElementById('upload-progress-fill');

  if (!title) { errEl.textContent = "Merci d'indiquer un titre."; return; }
  if (!file) { errEl.textContent = "Merci de choisir un fichier."; return; }

  const ext = file.name.split('.').pop().toLowerCase();
  const fileType = ext === 'pdf' ? 'pdf' : (ext === 'doc' || ext === 'docx') ? 'docx' : 'pptx';

  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Envoi en cours…";
  progressWrap.style.display = "block";

  try {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    // resource_type "raw" est nécessaire pour les fichiers non-image (PDF, Word, PowerPoint)
    // Les PDF utilisent resource_type "image" pour un affichage en ligne (inline) dans le navigateur.
    // Word/PowerPoint restent en "raw" — le visualiseur Office récupère le fichier lui-même, donc peu importe.
    const uploadUrl = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`;

    const fileUrl = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", uploadUrl, true);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressFill.style.width = pct + '%';
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          const data = JSON.parse(xhr.responseText);
          resolve(data.secure_url);
        } else {
          reject(new Error("Échec de l'envoi (code " + xhr.status + ")"));
        }
      };
      xhr.onerror = () => reject(new Error("Erreur réseau pendant l'envoi."));
      xhr.send(formData);
    });

    await db.collection("subjects").doc(subjectId).collection("themes").doc(themeId).collection("courses").add({
      title, description: desc, level: level || null, visibility,
      fileUrl, fileType,
      createdBy: currentProfile.name, createdAt: new Date().toISOString()
    });

    renderAdminCourses(subjectId, subjectName, themeId, themeName);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "+ Ajouter le document";
    progressWrap.style.display = "none";
    errEl.textContent = "Erreur lors de l'envoi : " + e.message;
  }
}

/* ============ LECTEUR DE DOCUMENT INTÉGRÉ (Google Docs Viewer pour PDF, Office Viewer pour Word/PowerPoint) ============ */
function renderDocumentViewer(course, onBack) {
  const isPdf = course.fileType === "pdf";
  const viewerSrc = isPdf
    ? `https://docs.google.com/viewer?embedded=true&url=${encodeURIComponent(course.fileUrl)}`
    : `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(course.fileUrl)}`;

  render(`
    <div class="screen active" style="padding:0; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); flex-shrink:0;">
        <span id="viewer-back" style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--schist); cursor:pointer;">← Retour</span>
        <span style="font-family:'Fraunces',serif; font-weight:600; font-size:13px; text-align:center; flex:1; margin:0 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${course.title}</span>
        <a href="${course.fileUrl}" target="_blank" rel="noopener" style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--laterite); text-decoration:none; flex-shrink:0;">Télécharger</a>
      </div>
      <div style="flex:1; position:relative; background:#e9e4d8;">
        <div id="viewer-loading" class="loading" style="position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center;">Chargement du document…</div>
        <iframe id="doc-iframe" src="${viewerSrc}" style="width:100%; height:100%; border:none; position:relative; z-index:1;"></iframe>
      </div>
    </div>
  `);
  document.getElementById('viewer-back').onclick = onBack;
  const iframe = document.getElementById('doc-iframe');
  iframe.onload = () => { document.getElementById('viewer-loading').style.display = 'none'; };
}

/* ============ OBSERVATEUR D'AUTHENTIFICATION ============ */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const doc = await db.collection("users").doc(user.uid).get();
    if (!doc.exists) {
      // Cas rare : compte auth existe mais pas de profil Firestore (ex. compte supprimé par un admin)
      await auth.signOut();
      alert("Ce compte n'existe plus ou a été supprimé.");
      return;
    }
    currentProfile = doc.data();
    if (currentProfile.status === "disabled") {
      await auth.signOut();
      alert("Ce compte a été désactivé. Contacte un administrateur pour plus d'informations.");
      return;
    }
    if (currentProfile.role === "enseignant") {
      renderTeacher();
    } else if (currentProfile.role === "admin") {
      renderAdmin();
    } else if (currentProfile.role === "entreprise") {
      renderCompany();
    } else {
      renderHome();
    }
  } else {
    currentUser = null;
    currentProfile = null;
    renderAuthScreen();
  }
});
